# Symbol resolution. Hand-maintained; the extractor never guesses beyond this.
#
# Keys are lowercased raw tokens as they appear in tweets (without any leading $).
# `symbol` is the data-source ticker; `asset_class` picks the fetcher (spec §5).
#
# `subject_only: true` means the asset is real but has no OHLCV feed anywhere.
# Those produce a no-chart card (spec §9.1), NOT an unresolved entry, and NOT a
# fuzzy match onto a similarly named listed token.

