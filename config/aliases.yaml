# Registry keys too ambiguous for the bare-prose keyword scan. They still resolve
# from an explicit cashtag or from the LLM pass, which sees context.
#   coin  -> "shitcoin", "this coin"
#   meta  -> crypto slang for a narrative
#   link  -> ordinary English
#   sui   -> substring risk, and rare in prose
#   pump  -> "pump", "pumping" are ordinary crypto prose
#   abb   -> too short to be safe in bare text
keyword_exclude:
  - pump
  - abb
  - gme
  - coin
  - meta
  - link
  - sui
  - jup
  - jto
  - bse
  - oil

# Tokens that must never resolve to anything. Common false positives from the
# cashtag regex and from prose.
# Quoted throughout: YAML 1.1 parses bare on/off/yes/no/y/n as booleans.
stopwords:
  - "a"
  - "i"
  - "the"
  - "it"
  - "is"
  - "to"
  - "do"
  - "go"
  - "up"
  - "in"
  - "on"
  - "at"
  - "no"
  - "y"
  - "n"
  - usd
  - usdt
  - usdc
  - ath
  - eod
  - ipo
  - ceo
  - etf
  - api
  - gm
  - lfg
  - ngmi
  - wagmi
